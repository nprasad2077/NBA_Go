global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nba-api'
    static_configs:
      - targets: ['api1:5000', 'api2:5000', 'api3:5000']
    metrics_path: '/metrics'

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy-exporter:9101']
    metrics_path: '/metrics'

  # Cloudflare edge cache stats (cmd/cfexporter). Counters only move every
  # POLL_INTERVAL (5m), so use rate()/increase() windows of at least 10m.
  - job_name: 'cf-edge'
    static_configs:
      - targets: ['cf-exporter:9200']

  # NGINX proxy_cache HIT/MISS per route (nginx/nginxlog-exporter.yml).
  - job_name: 'nginx-cache'
    static_configs:
      - targets: ['nginx-log-exporter:4040']
