# "import-data" disabled
services:
  db-init:
    build: .
    command: ["/nba_go", "import-data"]
    networks:
      - coolify-shared
      # - api_network
    restart: "no"

  api1:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  api2:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  api3:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  nginx:
    build:
      context: ./nginx
    volumes:
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api1
      - api2
      - api3
    ports:
      # --- MODIFICATION ---
      # Map container port 8080 to a static HOST port 8081.
      - "8081:8080"
    networks:
      - coolify-shared
      # - api_network

  prometheus:
    build:
      context: ./prometheus
    volumes:
      - 'prometheus_data:/prometheus'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      # --- MODIFICATION ---
      # Map container port 9090 to a static HOST port 9091.
      - "9091:9090"
    networks:
      - coolify-shared
      # - api_network
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
    ports:
      # --- MODIFICATION ---
      # Map container port 3000 to a static HOST port 3001.
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=testing
    volumes:
      - 'grafana_data:/var/lib/grafana'
    networks:
      - coolify-shared
      # - api_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  nginx_cache:

networks:
  # api_network:
  #   driver: bridge
  coolify-shared:
    name: coolify
    external: true