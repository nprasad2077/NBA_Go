# "import-data" disabled
services:
  db-init:
    build: .
    command: ["/nba_go"]
    networks:
      - coolify-shared
      # - api_network
    restart: "no"

  api1:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  api2:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  api3:
    build: .
    networks:
      - coolify-shared
      # - api_network
    restart: always

  nginx:
    build:
      context: ./nginx
    volumes:
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api1
      - api2
      - api3
      # nginx resolves the syslog target in nginx.conf once at startup.
      - nginx-log-exporter
    ports:
      # --- MODIFICATION ---
      # Map container port 8080 to a static HOST port 8081.
      - "8081:8080"
    networks:
      - coolify-shared
      # - api_network

  haproxy-exporter:
    image: prom/haproxy-exporter:v0.15.0
    command:
      - '--haproxy.scrape-uri=http://178.105.149.129:7080/;csv'
    ports:
      - "9101:9101"
    networks:
      - coolify-shared
    restart: unless-stopped

  # NGINX proxy_cache HIT/MISS metrics, parsed from access logs sent over syslog.
  # Internal only: Prometheus scrapes nginx-log-exporter:4040 on the shared network.
  nginx-log-exporter:
    build:
      context: ./nginx
      dockerfile: Dockerfile.log-exporter
    networks:
      - coolify-shared
    restart: unless-stopped

  # Cloudflare edge cache metrics, polled from the GraphQL Analytics API.
  # CF_API_TOKEN needs only Zone > Analytics > Read on space-city.dev; set it in Coolify.
  cf-exporter:
    build:
      context: .
      dockerfile: cmd/cfexporter/Dockerfile
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ZONE_ID=7d69da33a55de2d30a9e68fef097d8d9
      - CF_HOST=nba.space-city.dev
    networks:
      - coolify-shared
    restart: unless-stopped

  prometheus:
    build:
      context: ./prometheus
    volumes:
      - 'prometheus_data:/prometheus'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      # --- MODIFICATION ---
      # Map container port 9090 to a static HOST port 9091.
      - "9091:9090"
    networks:
      - coolify-shared
      # - api_network
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
    ports:
      # --- MODIFICATION ---
      # Map container port 3000 to a static HOST port 3001.
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=testing
    volumes:
      - 'grafana_data:/var/lib/grafana'
    networks:
      - coolify-shared
      # - api_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  nginx_cache:

networks:
  # api_network:
  #   driver: bridge
  coolify-shared:
    name: coolify
    external: true
