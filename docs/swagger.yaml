info:
  contact: {}
  description: Stats service, now with public access!
  title: NBA_Go API
  version: "1.0"
paths:
  /api/games:
    get:
      description: Returns a paginated list of games with optional filters and included
        associations.
      parameters:
      - description: Filter by date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Filter by team abbreviation (e.g., LAL)
        in: query
        name: team
        type: string
      - description: Filter by a specific Game ID
        in: query
        name: gameId
        type: string
      - description: Filter for playoff games
        in: query
        name: isPlayoff
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      - default: date
        description: Field to sort by (e.g., date)
        in: query
        name: sortBy
        type: string
      - default: false
        description: Sort ascending
        in: query
        name: ascending
        type: boolean
      - description: Comma-separated list of associations to include (e.g., lineScores,playerGameBasicStats,teamGameAdvStats)
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.GamesResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get game data
      tags:
      - Games
  /api/playeradvancedstats:
    get:
      consumes:
      - application/json
      description: Returns filtered and paginated player advanced stats
      parameters:
      - description: Season (e.g., 2025)
        in: query
        name: season
        type: integer
      - description: Team abbreviation (e.g., MIL)
        in: query
        name: team
        type: string
      - description: Player ID (e.g., greenaj01)
        in: query
        name: playerId
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      - default: winShares
        description: Field to sort by
        in: query
        name: sortBy
        type: string
      - default: false
        description: Sort ascending
        in: query
        name: ascending
        type: boolean
      - description: Whether playoffs?
        in: query
        name: isPlayoff
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AdvancedStatsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get player advanced stats
      tags:
      - PlayerStats
      x-order: 2
  /api/playershotchart:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of shot-chart points, optionally filtered
        by various parameters.
      parameters:
      - description: Page number for pagination (defaults to 1)
        in: query
        name: page
        type: integer
      - description: Player ID (e.g., hardeja01)
        in: query
        name: playerId
        type: string
      - description: Season (e.g., 2023)
        in: query
        name: season
        type: integer
      - description: Game date (e.g., Oct 17, 2018)
        in: query
        name: date
        type: string
      - description: Quarter (e.g., 1st Qtr)
        in: query
        name: qtr
        type: string
      - description: Shot result (true for made, false for missed)
        in: query
        name: result
        type: boolean
      - description: Shot type (e.g., 2-pointer)
        in: query
        name: shot_type
        type: string
      - description: Opponent team (e.g., NOP)
        in: query
        name: opponent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PlayerShotChart'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get shot-chart data
      tags:
      - PlayerShotChart
      x-order: 3
  /api/playertotals:
    get:
      consumes:
      - application/json
      description: Filter and paginate player totals
      parameters:
      - description: Season (e.g. 2000)
        in: query
        name: season
        type: integer
      - description: Team abbreviation (e.g. LAL)
        in: query
        name: team
        type: string
      - description: Player ID (e.g. greenac01)
        in: query
        name: playerId
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: pageSize
        type: integer
      - description: Field to sort by (e.g. points, assists)
        in: query
        name: sortBy
        type: string
      - description: Sort ascending (default false)
        in: query
        name: ascending
        type: boolean
      - description: Whether the stats are for playoffs
        in: query
        name: isPlayoff
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PlayerTotalsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get player total stats
      tags:
      - PlayerTotals
      x-order: 1
schemes:
- https
- http
